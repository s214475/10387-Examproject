[project]
name = "sciqis"
version = "0.1.0"
description = "Base environment for SCIQIS tutorials"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "abtem>=1.0.10",
    "ase>=3.29.0",
    "gpaw>=26.7.0",
    "h5py>=3.14.0",
    "ipykernel>=6.30.0",
    "ipympl>=0.9.7",
    "ipython>=9.4.0",
    "ipywidgets>=8.1.7",
    "jax>=0.11.0",
    "jupyterlab>=4.4.5",
    "jupyterlab-git>=0.51.2",
    "line-profiler>=5.0.0",
    "lmfit>=1.3.4",
    "matplotlib>=3.10.5",
    "nbstripout>=0.9.1",
    "numba>=0.66.0",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "quscope>=0.2.0",
    "qutip>=5.2.0",
    "qutip-qip>=0.4.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pt_cluster"]